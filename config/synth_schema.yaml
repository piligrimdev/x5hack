version: "0.6.0"
# 0.4.0 (2026-09-03): added SKU-level financial fields (regular/paid price,
# cost, margin, savings), a stable per-SKU price catalog, individual
# visit-frequency/basket-size behavior (segments now differ on these
# instead of on price), a train/holdout temporal split, and
# forbidden_categories for challenge eligibility. Segments no longer carry
# price_multiplier (replaced by visit_frequency_multiplier +
# basket_size_multiplier) — chain still carries price_multiplier (real
# per-banner pricing). See docs/superpowers/specs/2026-09-03-financial-data-v2-design.md
#
# 0.5.0 (2026-09-03): explicit, recorded change to a frozen (0.4.0) config
# — see the freeze note below for why this needs recording, not a silent
# edit. Root-caused why the LLM-challenge module's hit rate on
# already_optimal_no_challenge profiles was 0/8: `visit_frequency_multiplier`
# up to 1.35 (Старшие) pushed that segment's MEAN rate to ~0.99/day, already
# at the practical one-purchase-per-day ceiling the old day-sampling model
# enforced — so a large share of the general population collided with the
# same day-count cap already_optimal's profiles hit, making "receipt count"
# useless as an observable signal for genuinely-high-frequency users.
# Compressed visit_frequency_multiplier to max 1.15 (Старшие) so every
# segment's mean stays under ~0.85/day, and synth/receipts.py's day-sampling
# switched from "sample distinct days, capped at window_days" to
# "Poisson(per_day_rate) receipts per day, uncapped" — see that file's
# docstring. Population and reference data must be regenerated after this
# change; anything generated against 0.4.0 is stale.
#
# 0.6.0 (2026-09-04): explicit, recorded change to a frozen (0.5.0) config.
# `category_economics.margin_pct` (originally 15-28%, uncited assumption)
# is realized against `synth/catalog.py`'s cost anchor — the CHEAPEST
# chain's price (Чижик, 0.75x), a deliberate earlier fix so a discount
# chain never sells below cost. Side effect never checked until now: any
# chain pricier than the anchor (Пятёрочка 1.0x, Перекрёсток 1.25x) earns
# margin on top of its own margin_pct, since its cost floor is set by a
# cheaper chain's price, not its own. Measured on the full 10k population:
# realized margin was 18.7% (Чижик, ≈ margin_pct as intended), 38.75%
# (Пятёрочка), 51.05% (Перекрёсток) — population-blended 38.81%, well
# above X5 Group's real public gross margin (~24-25%) and implausible for
# a hackathon economics story. Scaled every category's margin_pct down by
# a calibrated factor (x0.4708, bisected on a 1500-user sample against the
# existing cost-anchor design — not re-architected, to avoid a larger,
# riskier change this late) so the population-blended realized margin
# lands at ~30%. New range: 7.06%-13.18% (was 15%-28%) — plausible for
# lean staple categories, thin for margin-heavy ones (personal care,
# snacks) in absolute terms; the population-level 30% blended figure is
# the number this change was calibrated to, not the individual category
# values, which are a means to that end under the existing anchor design.
# Population, reference profiles, and simulation must be regenerated after
# this change; anything generated against 0.5.0 is stale.
frozen_at: "2026-09-04"
# FROZEN 2026-09-04 at v0.6.0, re-frozen after the margin-calibration
# change above (validated + tested before re-freezing — see
# data/v2/validation_report.md and the pytest run recorded in project
# history). Per CONTEXT_PACK.md §8's anti-circularity guard: do not change
# categories, category_economics, calibration, chains, segments,
# forbidden_categories, or temporal_split after this point without an
# explicit, recorded decision — H2/H3 LLM tuning starts against this exact
# schema, and changing it later would invalidate the hit-rate comparison.
# A version bump + changelog entry (like this one) is the explicit-decision
# mechanism if a change is truly needed; a silent edit is not.
reference_date: "2026-09-01"

# Regulated/sensitive categories: never eligible as a challenge target,
# regardless of user segment. Алкоголь is age-restricted (legal/regulatory
# reason); детское питание is a sensitive marketing-to-parents-of-infants
# category we choose to exclude rather than a legal requirement.
forbidden_categories:
  - "алкоголь"
  - "детское питание"

temporal_split:
  train_start: "2026-06-03"
  train_end: "2026-08-03"
  holdout_start: "2026-08-04"
  holdout_end: "2026-08-31"

calibration:
  avg_receipt_total_rub: 710.0
  purchases_per_month_mean: 22.0
  purchases_per_month_stddev: 6.5
  offline_share: 0.8
  source: >
    avg_receipt_total_rub: X5's own reported offline average check for
    Пятёрочка/Перекрёсток in 2025, 550-870 rub (midpoint used) — Retail.ru,
    "Как меняется средний чек в ритейле" (2025/2026).
    purchases_per_month_mean: derived, not directly reported. Rosstat's
    "Потребительские расходы домашних хозяйств в 2025 году" gives monthly
    food spend per person by household size (single: 19000 rub;
    3-person household: ~13000 rub/person; 5-person: ~10500 rub/person;
    2- and 4-person interpolated linearly, not independently sourced).
    Weighted by this config's household_size_weights: ~15512 rub/month/person.
    Dividing by the X5 average check above gives ~21.85 purchases/month,
    rounded to 22 — consistent with Rosstat's separate city-tier figures
    (14500-15000 rub/month for medium/large cities, in the same range as
    the weighted estimate). purchases_per_month_stddev kept at the same
    ~30% relative spread as the original unsourced assumption (not itself
    sourced from Rosstat, which does not publish a purchase-frequency
    variance). offline_share (0.8) and household_size_weights are still
    unsourced assumptions per CONTEXT_PACK.md §3/§4/§7 — no public data
    found for these two. Revisit if the case owner provides real numbers.

