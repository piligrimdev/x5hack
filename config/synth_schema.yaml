# Segments now differ on shopping BEHAVIOR (how often, how much per trip),
# not on price — price is a per-SKU/per-chain property (see catalog below
# and chains' price_multiplier above), which is more realistic than the
# old "same store charges different people different prices" model.
#
# visit_frequency_multiplier ranges were compressed from an earlier
# 0.85-1.35 (see v0.4.0) after the frequency-calibration fix in 0.5.0: the
# purchase-day model changed from "one receipt per sampled day, capped at
# the window's day count" to "Poisson(per_day_rate) receipts per day, no
# cap" (see synth/receipts.py), which exposed that visit_frequency_multiplier
# 1.35 pushed Старшие's MEAN rate to ~27.7/28days ≈ 0.99/day — already at
# the practical one-purchase-per-day ceiling before any personal variation,
# so most of that segment collided with the day-count cap regardless of the
# old capping mechanism. The new max (Старшие 1.15) keeps every segment's
# mean rate under ~0.85/day, leaving real headroom for personal variation
# and for `already_optimal_no_challenge`'s explicit 1.8-2.5x override (see
# synth/reference_profiles.py) to be a genuinely distinguishable outlier
# rather than something a normal high-frequency user regularly matches by
# chance.
segments:
  - name: "Молодёжь"
    visit_frequency_multiplier: 0.80
    basket_size_multiplier: 0.80
  - name: "Взрослые с вредными привычками"
    visit_frequency_multiplier: 0.95
    basket_size_multiplier: 0.85
  - name: "Взрослые с детьми до 3х лет"
    visit_frequency_multiplier: 1.10
    basket_size_multiplier: 1.25
  - name: "Зрелые"
    visit_frequency_multiplier: 1.00
    basket_size_multiplier: 1.15
  - name: "Старшие"
    visit_frequency_multiplier: 1.15
    basket_size_multiplier: 0.75

# Stable SKU price catalog: base_price_rub/margin_pct/popularity_weight are
# per CATEGORY; synth/catalog.py assigns each concrete item a stable
# per-SKU price by jittering base_price_rub +/- price_jitter_pct with a
# seed derived only from catalog position (not the run seed), so prices
# are the same catalog run to run and item to item within a category no
# longer share one price (this is the "соль и говядина have identical
# distributions" bug fix). margin_pct sets unit_cost_rub = price*(1-margin).
# popularity_weight is used for non-habitual ("exploration") category
# draws so the basket doesn't sample categories uniformly.
category_economics:
  - category: "молочные продукты и яйца"
