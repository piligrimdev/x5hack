openapi: 3.1.0
info:
  title: Points API (feature 007-cashback-points)
  version: 0.1.0
  description: |
    Новые эндпоинты для работы с баллами кешбека. Все user-facing эндпоинты
    требуют JWT (`Authorization: Bearer <token>`); `PUT /points/settings/rate`
    требует `X-Terminal-Token` (симметрично FR-013 спеки 005).

servers:
  - url: /

paths:
  /points/balance:
    get:
      summary: Получить баланс баллов текущего пользователя
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Баланс и текущий курс
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          description: Нет валидного JWT

  /points/transactions:
    get:
      summary: История операций с баллами (пагинация)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Список транзакций (order DESC by created_at)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsPage"
        "401":
          description: Нет валидного JWT

  /points/settings/rate:
    get:
      summary: Получить текущий курс баллов к рублю
      description: Публичный справочник, без авторизации.
      responses:
        "200":
          description: Текущий курс
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateResponse"

    put:
      summary: Установить курс (только для терминала)
      security:
        - terminalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateUpdate"
      responses:
        "200":
          description: Новый курс сохранён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateResponse"
        "401":
          description: Нет валидного X-Terminal-Token
        "422":
          description: rate_points_per_rub должен быть положительным целым числом

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    terminalToken:
      type: apiKey
      in: header
      name: X-Terminal-Token

  schemas:
    BalanceResponse:
      type: object
      required: [balance, rate_points_per_rub, balance_rub_equivalent]
      properties:
        balance:
          type: integer
          minimum: 0
          example: 490
          description: Текущий баланс баллов
        rate_points_per_rub:
          type: integer
          minimum: 1
          example: 10
          description: Действующий курс (сколько баллов = 1 руб)
        balance_rub_equivalent:
          type: integer
          minimum: 0
          example: 49
          description: balance // rate_points_per_rub (для отображения пользователю)

    TransactionOut:
      type: object
      required: [id, type, amount, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [earn, spend]
        amount:
          type: integer
          description: Положительное для earn, отрицательное для spend
          example: 50
        related_task_id:
          type: string
          format: uuid
          nullable: true
        related_receipt_id:
          type: string
          format: uuid
          nullable: true
        rate_at_time:
          type: integer
          nullable: true
          description: Курс на момент операции (NULL для earn)
        created_at:
          type: string
          format: date-time

    TransactionsPage:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionOut"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    RateResponse:
      type: object
      required: [rate_points_per_rub]
      properties:
        rate_points_per_rub:
          type: integer
          minimum: 1
          example: 10

    RateUpdate:
      type: object
      required: [rate_points_per_rub]
      properties:
        rate_points_per_rub:
          type: integer
          minimum: 1
          example: 20
