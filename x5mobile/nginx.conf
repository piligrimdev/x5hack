server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin API so the browser demo works on localhost and on a LAN IP
    # without rebuilding EXPO_PUBLIC_API_URL.
    location ~ ^/(login|register|refresh|me|users|health|docs|openapi\.json|receipts|basket|catalog|challenges|points|rewards|vibes|wheel|coupons|discounts|stores|leaderboard|referrals|terminal)(/|$) {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
